<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Clientes — PRUEBA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: rgba(255,255,255,0.08);
    --border-focus: rgba(255,255,255,0.3);
    --accent: #c8f06e;
    --accent-dark: #9abf45;
    --text: #f5f5f0;
    --muted: rgba(245,245,240,0.45);
    --muted2: rgba(245,245,240,0.2);
    --success-bg: rgba(200,240,110,0.12);
    --success-border: rgba(200,240,110,0.35);
    --error-bg: rgba(255,90,90,0.12);
    --error-border: rgba(255,90,90,0.35);
    --error-text: #ff8080;
    --radius: 10px;
    --radius-lg: 16px;
  }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem 4rem;
    -webkit-text-size-adjust: 100%;
  }

  .container {
    width: 100%;
    max-width: 620px;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

  /* HEADER */
  .header {
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand { font-family: 'DM Serif Display', serif; font-size: clamp(1.5rem, 5vw, 2.2rem); letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .brand span { color: var(--accent); }
  .date-badge { font-size: clamp(10px, 2.5vw, 12px); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 5px 12px; border: 0.5px solid var(--border); border-radius: 100px; white-space: nowrap; }

  /* CARD */
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: clamp(1.25rem, 4vw, 2rem); }

  .section-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }

  label { font-size: 11px; font-weight: 500; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; }

  input, textarea, select {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(14px, 4vw, 16px);
    font-weight: 300;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    width: 100%;
    -webkit-appearance: none;
    touch-action: manipulation;
  }
  input::placeholder, textarea::placeholder { color: var(--muted2); }
  input:focus, textarea:focus { border-color: var(--border-focus); background: #2a2a2a; }
  input[type="date"] { cursor: pointer; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; width: 20px; height: 20px; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

  .price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 1.25rem 0;
  }
  .price-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .price-value { font-family: 'DM Serif Display', serif; font-size: clamp(20px, 6vw, 28px); color: var(--accent); letter-spacing: -0.02em; }

  .divider { border: none; border-top: 0.5px solid var(--border); margin: 1.5rem 0; }

  /* BUTTONS */
  .btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: #0f0f0f;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(14px, 4vw, 16px);
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.1s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    min-height: 50px;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-outline { background: transparent; color: var(--text); border: 0.5px solid var(--border); }
  .btn-outline:hover { background: var(--surface2); }

  /* STATUS */
  .status { margin-top: 12px; padding: 12px 16px; border-radius: var(--radius); font-size: 14px; display: none; align-items: center; gap: 10px; line-height: 1.4; }
  .status.success { display: flex; background: var(--success-bg); border: 0.5px solid var(--success-border); color: var(--accent); }
  .status.error { display: flex; background: var(--error-bg); border: 0.5px solid var(--error-border); color: var(--error-text); }

  .footer { margin-top: 2rem; text-align: center; font-size: 12px; color: var(--muted); }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: flex-end; justify-content: center; padding: 0; }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .modal {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 1.5rem;
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
    -webkit-overflow-scrolling: touch;
  }

  @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 1.25rem; }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: clamp(1.2rem, 5vw, 1.5rem); margin-bottom: 0.3rem; color: var(--text); }
  .modal-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; }

  .modal-table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; }
  .modal-table tr { border-bottom: 0.5px solid var(--border); }
  .modal-table tr:last-child { border-bottom: none; }
  .modal-table td { padding: 9px 0; font-size: clamp(12px, 3.5vw, 14px); }
  .modal-table td:first-child { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; width: 38%; }
  .modal-table td:last-child { color: var(--text); font-weight: 500; word-break: break-word; }
  .modal-total-row td:last-child { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--accent); }

  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* SPINNER */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #0f0f0f; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }

  /* RESPONSIVE */
  @media (max-width: 480px) {
    body { padding: 1.25rem 0.75rem 3rem; }
    .grid-2 { grid-template-columns: 1fr; }
    .modal-btns { grid-template-columns: 1fr; }
  }

  @media (min-width: 768px) {
    .modal-overlay { align-items: center; padding: 1rem; }
    .modal { border-radius: var(--radius-lg); max-height: 85vh; }
    .modal-handle { display: none; }
    @keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  }
</style>
</head>
<body>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Confirmar registro</div>
    <div class="modal-subtitle">Revisa los datos antes de enviar a Google Drive</div>
    <table class="modal-table">
      <tr><td>Empleado</td><td id="m-empleado">-</td></tr>
      <tr><td>Cliente</td><td id="m-nombre">-</td></tr>
      <tr><td>Telefono</td><td id="m-telefono">-</td></tr>
      <tr><td>Direccion</td><td id="m-direccion">-</td></tr>
      <tr><td>Fecha</td><td id="m-fecha">-</td></tr>
      <tr><td>Producto</td><td id="m-producto">-</td></tr>
      <tr><td>Cantidad</td><td id="m-cantidad">-</td></tr>
      <tr><td>Precio unit.</td><td id="m-precio">-</td></tr>
      <tr><td>Notas</td><td id="m-notas">-</td></tr>
      <tr class="modal-total-row"><td>Total</td><td id="m-total">-</td></tr>
    </table>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" id="btnConfirmar" onclick="confirmarEnvio()">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Confirmar y guardar
      </button>
    </div>
  </div>
</div>

<div class="container">
  <div class="header">
    <div class="brand">PRUEBA<span>.</span></div>
    <div class="date-badge" id="fechaHoy"></div>
  </div>

  <div class="card">
    <div class="section-title">Empleado responsable</div>
    <div class="field">
      <label>Nombre del empleado</label>
      <input type="text" id="empleado" placeholder="Ej. Juan Perez" autocomplete="name" required>
    </div>

    <hr class="divider">

    <div class="section-title">Datos del cliente</div>
    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="nombre" placeholder="Ej. Maria Garcia Lopez" autocomplete="off" required>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Telefono</label>
        <input type="tel" id="telefono" placeholder="0991234567" autocomplete="off" inputmode="tel">
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>
    </div>
    <div class="field">
      <label>Direccion</label>
      <input type="text" id="direccion" placeholder="Calle, numero, sector" autocomplete="off">
    </div>

    <hr class="divider">

    <div class="section-title">Detalle del pedido</div>
    <div class="field">
      <label>Producto</label>
      <input type="text" id="producto" placeholder="Ej. Televisor Samsung 50" autocomplete="off" required>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>Cantidad</label>
        <input type="number" id="cantidad" placeholder="1" min="1" value="1" inputmode="numeric" oninput="calcTotal()">
      </div>
      <div class="field">
        <label>Precio unitario ($)</label>
        <input type="number" id="precio" placeholder="0.00" step="0.01" min="0" inputmode="decimal" oninput="calcTotal()">
      </div>
    </div>

    <div class="price-row">
      <span class="price-label">Total calculado</span>
      <span class="price-value" id="total">$0.00</span>
    </div>

    <div class="field">
      <label>Notas adicionales</label>
      <textarea id="notas" placeholder="Observaciones, condiciones de pago, entregas..."></textarea>
    </div>

    <hr class="divider">

    <button class="btn" id="btnGuardar" onclick="abrirModal()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 10v2a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 12v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8 2v7M5.5 6.5 8 9l2.5-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Guardar registro
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">PRUEBA - Sistema de Registro de Clientes</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyrxz3R-GMW5TTXxLJquV-89c6iD2JkFxzEHdG7lKu74hlId3YgI-55sPx9VspH4DnJVA/exec";
  let dataPendiente = null;

  (function() {
    const hoy = new Date();
    document.getElementById('fechaHoy').textContent = hoy.toLocaleDateString('es-EC', { weekday:'long', day:'numeric', month:'long' });
    const yyyy = hoy.getFullYear();
    const mm = String(hoy.getMonth()+1).padStart(2,'0');
    const dd = String(hoy.getDate()).padStart(2,'0');
    document.getElementById('fecha').value = yyyy+'-'+mm+'-'+dd;
  })();

  function calcTotal() {
    const qty = parseFloat(document.getElementById("cantidad").value) || 1;
    const price = parseFloat(document.getElementById("precio").value) || 0;
    document.getElementById("total").textContent = "$" + (qty * price).toFixed(2);
  }

  function setStatus(type, msg) {
    const el = document.getElementById("status");
    el.className = "status " + type;
    el.innerHTML = msg;
  }

  function abrirModal() {
    const empleado  = document.getElementById("empleado").value.trim();
    const nombre    = document.getElementById("nombre").value.trim();
    const telefono  = document.getElementById("telefono").value.trim();
    const fecha     = document.getElementById("fecha").value;
    const direccion = document.getElementById("direccion").value.trim();
    const producto  = document.getElementById("producto").value.trim();
    const cantidad  = document.getElementById("cantidad").value || "1";
    const precio    = document.getElementById("precio").value;
    const notas     = document.getElementById("notas").value.trim();

    if (!empleado || !nombre || !producto || !precio) {
      setStatus("error", "Completa los campos obligatorios: empleado, nombre, producto y precio.");
      return;
    }

    const total = (parseFloat(cantidad) * parseFloat(precio)).toFixed(2);
    dataPendiente = { empleado, nombre, telefono, fecha, direccion, producto, cantidad, precio, total, notas };

    document.getElementById("m-empleado").textContent  = empleado;
    document.getElementById("m-nombre").textContent    = nombre;
    document.getElementById("m-telefono").textContent  = telefono || "-";
    document.getElementById("m-direccion").textContent = direccion || "-";
    document.getElementById("m-fecha").textContent     = fecha || "-";
    document.getElementById("m-producto").textContent  = producto;
    document.getElementById("m-cantidad").textContent  = cantidad;
    document.getElementById("m-precio").textContent    = "$" + parseFloat(precio).toFixed(2);
    document.getElementById("m-notas").textContent     = notas || "-";
    document.getElementById("m-total").textContent     = "$" + total;

    document.getElementById("modalOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function cerrarModal() {
    document.getElementById("modalOverlay").classList.remove("open");
    document.body.style.overflow = "";
    dataPendiente = null;
  }

  async function confirmarEnvio() {
    if (!dataPendiente) return;
    const btn = document.getElementById("btnConfirmar");
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Enviando...';

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dataPendiente)
      });
      cerrarModal();
      setStatus("success", "Registro guardado correctamente en Google Drive!");
      ["empleado","nombre","telefono","direccion","producto","precio","notas"].forEach(id => {
        document.getElementById(id).value = "";
      });
      document.getElementById("cantidad").value = "1";
      document.getElementById("total").textContent = "$0.00";
      const hoy = new Date();
      const yyyy = hoy.getFullYear();
      const mm = String(hoy.getMonth()+1).padStart(2,'0');
      const dd = String(hoy.getDate()).padStart(2,'0');
      document.getElementById('fecha').value = yyyy+'-'+mm+'-'+dd;
    } catch(err) {
      cerrarModal();
      setStatus("error", "Error de conexion. Intenta de nuevo.");
    }

    btn.disabled = false;
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Confirmar y guardar';
    dataPendiente = null;
  }

  document.getElementById("modalOverlay").addEventListener("click", function(e) {
    if (e.target === this) cerrarModal();
  });
</script>
</body>
</html>
