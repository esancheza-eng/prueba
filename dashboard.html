<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Aqua Luan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* MANTENEMOS TU DISEÑO ORIGINAL */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy: #1a3a5c; --teal: #0a7c6e; --accent: #4ec9a0; --text: #1a3a5c; --radius: 14px; }
  body { background: linear-gradient(135deg, #d8e8f2 0%, #e8f2f8 100%); min-height: 100vh; font-family: 'DM Sans', sans-serif; color: var(--text); }
  .login-overlay { position: fixed; inset: 0; background: var(--navy); z-index: 999; display: flex; align-items: center; justify-content: center; }
  .login-overlay.hidden { display: none; }
  .login-box { background: white; padding: 2.5rem; border-radius: var(--radius); width: 100%; max-width: 380px; text-align: center; }
  .header { background: var(--navy); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; color: white; }
  .layout { display: flex; }
  .sidebar { width: 300px; background: var(--navy); padding: 1.25rem; color: white; min-height: calc(100vh - 64px); }
  .content { flex: 1; padding: 1.5rem; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 1.25rem; }
  .kpi-card { background: white; padding: 1.25rem; border-radius: var(--radius); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
  .chart-card { background: white; padding: 1.25rem; border-radius: var(--radius); margin-bottom: 1.25rem; }
  .hidden { display: none !important; }
  input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
  th { background: var(--navy); color: white; padding: 10px; text-align: left; font-size: 12px; }
  td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2 style="color:var(--navy)">AQUA LUAN</h2>
    <p style="margin-bottom:1.5rem; font-size:12px; color:#666">Dashboard Seguro</p>
    <input type="text" id="loginUser" placeholder="Usuario">
    <input type="password" id="loginPass" placeholder="Contraseña" style="margin-top:10px">
    <button onclick="doLogin()" style="width:100%; padding:12px; background:var(--accent); border:none; border-radius:8px; margin-top:15px; font-weight:bold; cursor:pointer">Ingresar</button>
    <p id="loginError" style="color:red; display:none; margin-top:10px; font-size:12px">Usuario o clave incorrectos</p>
  </div>
</div>

<div class="header">
  <div style="font-weight:800; font-size:1.2rem">AQUA LUAN <span>DASHBOARD</span></div>
  <button onclick="location.reload()" style="background:rgba(255,255,255,0.1); border:1px solid white; color:white; padding:5px 15px; border-radius:20px; cursor:pointer">Salir</button>
</div>

<div class="layout">
  <div class="sidebar">
    <h4 style="color:var(--accent)">Filtros de Reporte</h4>
    <div style="margin-top:20px">
      <label style="font-size:10px; opacity:0.6">FECHA</label>
      <input type="date" id="filtroFecha">
    </div>
    <button onclick="cargarDatos()" style="margin-top:15px; width:100%; padding:10px; background:var(--accent); border:none; border-radius:8px; font-weight:bold; cursor:pointer">Aplicar Filtro</button>
  </div>

  <div class="content">
    <div class="kpi-grid" id="kpiGrid">
        </div>

    <div class="chart-card">
      <h4 style="font-size:11px; margin-bottom:15px; color:var(--teal)">RESUMEN DE VENTAS</h4>
      <canvas id="chartVentas" height="100"></canvas>
    </div>

    <div style="background:white; border-radius:14px; overflow:hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05)">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="tablaPedidos"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-AimadRlsKD3mKqOWq9gmTybPkvqdd-K6-Tlxo4cdguqFt11hF9RO2N27-t68_uQT/exec";
let todosLosDatos = [];
let chartVentas = null;

async function doLogin() {
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  
  const resp = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ accion: 'login', user: user, pass: pass })
  });
  const res = await resp.json();

  if (res.result === 'ok') {
    document.getElementById('loginOverlay').classList.add('hidden');
    iniciar();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function iniciar() {
  document.getElementById('filtroFecha').value = new Date().toISOString().split('T')[0];
  cargarDatos();
}

async function cargarDatos() {
  const resp = await fetch(`${SCRIPT_URL}?token=aqua2026&t=${Date.now()}`);
  const json = await resp.json();

  if (json.result === 'ok') {
    todosLosDatos = json.data;
    renderDashboard();
  }
}

function renderDashboard() {
  const filtro = document.getElementById('filtroFecha').value;
  const datos = todosLosDatos.filter(r => String(r.FECHA).includes(filtro) || !filtro);
  
  // KPIs
  const total = datos.reduce((s, r) => s + (parseFloat(r['TOTAL PEDIDO ($)']) || 0), 0);
  const unidades = datos.reduce((s, r) => s + (parseFloat(r['CANTIDAD']) || 0), 0);
  
  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi-card"><h3>$${total.toFixed(2)}</h3><p style="font-size:10px; color:#999">TOTAL VENTAS</p></div>
    <div class="kpi-card"><h3>${unidades}</h3><p style="font-size:10px; color:#999">BOTELLONES</p></div>
    <div class="kpi-card"><h3>${datos.length}</h3><p style="font-size:10px; color:#999">PEDIDOS</p></div>
  `;

  // TABLA
  document.getElementById('tablaPedidos').innerHTML = datos.map(r => `
    <tr>
      <td>${String(r.FECHA).split('T')[0]}</td>
      <td>${r.CLIENTE}</td>
      <td>${r.PRODUCTO || '-'}</td>
      <td>${r.CANTIDAD || '-'}</td>
      <td><strong>$${parseFloat(r['TOTAL PEDIDO ($)'] || 0).toFixed(2)}</strong></td>
    </tr>
  `).join('');

  renderGrafica(datos);
}

function renderGrafica(datos) {
  const ctx = document.getElementById('chartVentas').getContext('2d');
  if (chartVentas) chartVentas.destroy();

  const ventasPorHora = {};
  datos.forEach(r => {
    const hora = String(r['HORA REGISTRO']).split(':')[0];
    if(hora) ventasPorHora[hora] = (ventasPorHora[hora] || 0) + (parseFloat(r['TOTAL PEDIDO ($)']) || 0);
  });

  chartVentas = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Object.keys(ventasPorHora).map(h => h + ":00"),
      datasets: [{ label: 'Ventas por Hora', data: Object.values(ventasPorHora), borderColor: '#0a7c6e', tension: 0.4 }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}
</script>
</body>
</html>
