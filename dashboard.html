<script>

/* ════════════════════════════════════════
CONFIG
════════════════════════════════════════ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-AimadRlsKD3mKqOWq9gmTybPkvqdd-K6-Tlxo4cdguqFt11hF9RO2N27-t68_uQT/exec';

const USUARIO = 'supervisor';
const CLAVE = 'aqua2026';

let todosLosDatos = [];
let charts = {};
let autoRefreshInterval = null;
let datosNotasFiltrados = [];

/* ════════════════════════════════════════
LOGIN
════════════════════════════════════════ */
async function doLogin() {

  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;

  const btn = document.querySelector('.btn-login');
  const errorMsg = document.getElementById('loginError');

  btn.innerHTML = "Verificando...";

  if (errorMsg) {
    errorMsg.classList.remove('show');
  }

  try {

    const resp = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        accion: 'login',
        user: user,
        pass: pass
      })
    });

    const res = await resp.json();

    if (res.result === 'ok') {

      document.getElementById('loginOverlay')
        .classList.add('hidden');

      iniciar();

    } else {

      if (errorMsg) {
        errorMsg.classList.add('show');
      }

      btn.innerHTML = "Ingresar al Dashboard";
    }

  } catch (err) {

    alert("Error de conexión con el servidor");

    btn.innerHTML = "Ingresar al Dashboard";
  }
}

/* ════════════════════════════════════════
INICIAR
════════════════════════════════════════ */
function iniciar() {

  const hoy = new Date();

  const yyyy = hoy.getFullYear();
  const mm = String(hoy.getMonth() + 1).padStart(2, '0');
  const dd = String(hoy.getDate()).padStart(2, '0');

  document.getElementById('filtroFecha').value =
    `${yyyy}-${mm}-${dd}`;

  document.getElementById('notasFecha').value =
    `${yyyy}-${mm}-${dd}`;

  cargarDatos();

  autoRefreshInterval = setInterval(() => {

    const hora = new Date().getHours();

    if (hora >= 7 && hora < 20) {
      cargarDatos(false);
    }

  }, 60000);
}

/* ════════════════════════════════════════
CARGAR DATOS
════════════════════════════════════════ */
async function cargarDatos(mostrarSpinner = true) {

  const kpiGrid = document.getElementById('kpiGrid');

  if (mostrarSpinner && kpiGrid) {

    kpiGrid.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <span>Cargando datos seguros...</span>
      </div>
    `;
  }

  try {

    const resp = await fetch(
      `${SCRIPT_URL}?token=aqua2026&t=${Date.now()}`
    );

    const json = await resp.json();

    if (json.result === 'ok') {

      todosLosDatos = json.data || [];

      renderDashboard();

      document.getElementById('lastUpdate').textContent =
        'Actualizado: ' + new Date().toLocaleTimeString();

    } else {

      if (kpiGrid) {

        kpiGrid.innerHTML = `
          <div class="loading">
            <span>⚠️ Error: ${json.error}</span>
          </div>
        `;
      }
    }

  } catch (err) {

    console.error("Error en fetch:", err);

    if (kpiGrid) {

      kpiGrid.innerHTML = `
        <div class="loading">
          <span>⚠️ Error de conexión</span>
        </div>
      `;
    }
  }
}

/* ════════════════════════════════════════
FILTROS
════════════════════════════════════════ */
function filtrarHoy() {

  const hoy = new Date();

  const yyyy = hoy.getFullYear();
  const mm = String(hoy.getMonth() + 1).padStart(2, '0');
  const dd = String(hoy.getDate()).padStart(2, '0');

  document.getElementById('filtroFecha').value =
    `${yyyy}-${mm}-${dd}`;

  renderDashboard();
}

function limpiarFiltro() {

  document.getElementById('filtroFecha').value = '';

  renderDashboard();
}

function getDatosFiltrados() {

  const filtro =
    document.getElementById('filtroFecha').value;

  if (!filtro) return todosLosDatos;

  return todosLosDatos.filter(r => {

    const fecha =
      r['FECHA'] || r['fecha'] || '';

    return String(fecha).includes(filtro);
  });
}

</script>
</body>
</html>
